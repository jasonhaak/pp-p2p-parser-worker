name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage==7.2.4

      - name: Generate provider configs
        run: python tools/generate_provider_configs.py

      - name: Validate Worker bundle
        run: npx wrangler@ deploy --dry-run

      - name: Check Python syntax
        run: python -m py_compile src/*.py tools/*.py

      - name: Check CLI entrypoint
        run: python -m src.cli --help

      - name: Check frontend JavaScript syntax
        run: node --check public/app.js

      - name: Run Python tests
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s test -q

      - name: Run Python coverage
        if: github.event_name == 'push'
        run: |
          coverage run --source=src -m unittest discover -s test -q
          coverage xml
          coverage html -d coverage

      - name: Upload coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage reports to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
